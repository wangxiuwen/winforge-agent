<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WinForge Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- 左侧图标栏（微信式深色栏） -->
  <aside class="sidebar">
    <div class="logo">W</div>
    <nav class="nav">
      <button class="nav-btn active" data-tab="share" title="共享">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="2" y="4" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 18h6M9 14v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="16" y="8" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="nav-btn" data-tab="transfer" title="传输">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6a2.5 2.5 0 0 1 2.5-2.5h11A2.5 2.5 0 0 1 20 6v8a2.5 2.5 0 0 1-2.5 2.5H9L5 20.5V6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn" data-tab="control" title="控制">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 3l7 16 2.2-6.8L21 10 5 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-btn" id="btn-exit" title="退出">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v9M12 3l-3 3M12 3l3 3M5 12H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </aside>

  <!-- 中间列表栏（微信式浅色列表） -->
  <aside class="list-panel">
    <div class="search-row">
      <input id="search" type="text" placeholder="搜索">
      <button id="btn-pair" class="mini-green" title="配对新设备">＋配对</button>
    </div>
    <div id="list-title" class="list-header">设备</div>
    <div id="peer-list" class="peer-list"></div>
    <div id="list-extra"></div>
  </aside>

  <!-- 右侧内容区 -->
  <main class="content">
    <div class="content-header"><span id="content-title">共享</span>
      <label class="share-switch"><input type="checkbox" id="share-toggle"> 键鼠共享</label>
      <span class="hotkey" id="hotkey-hint"></span>
    </div>

    <!-- 共享视图 -->
    <section id="view-share" class="view active">
      <div id="share-detail"></div>
    </section>

    <!-- 传输视图：聊天 + 文件 -->
    <section id="view-transfer" class="view">
      <div class="chat-view">
        <div class="chat-header"><span id="chat-peer-name">选择设备</span>
          <button id="chat-clear" class="link-btn">清空记录</button>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <div class="chat-input">
          <input id="chat-text" type="text" placeholder="给对方发条消息…">
          <button id="chat-send">发送</button>
        </div>
      </div>
      <div class="file-pane">
        <div class="file-header">文件传输</div>
        <div class="file-actions">
          <input id="file-path" type="text" placeholder="或输入本机文件路径">
          <button id="file-send">发送文件</button>
          <button id="file-pick" class="ghost">选择文件…</button>
        </div>
        <div id="transfer-list"></div>
        <div class="downloads-row">
          <button id="open-downloads" class="ghost">打开接收目录</button>
        </div>
      </div>
    </section>

    <!-- 控制视图 -->
    <section id="view-control" class="view">
      <div id="startup-banner" class="hidden"></div>
      <div class="control-view">
        <div class="ctl-status" id="ctl-status">空闲</div>
        <div id="screen-wrap" class="hidden">
          <div class="screen-title">对方屏幕（实时画面）</div>
          <img id="remote-screen" alt="对方屏幕画面">
        </div>
        <div id="control-detail"></div>
        <div class="control-hint">
          <p>· 把对端设为左/右方位后，将鼠标推过对应屏幕边缘即可控制对方</p>
          <p>· 对方推回共享边即交还控制；热键 <b id="hotkey-inline"></b> 随时切换</p>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 配对弹窗 -->
<div id="pair-modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="pair-title">配对</h3>
    <div id="pair-body"></div>
    <div class="modal-actions" id="pair-actions"></div>
  </div>
</div>

<div id="toasts"></div>
<input type="file" id="file-input" class="hidden">
<script src="app.js"></script>
</body>
</html>
