name: CI

on:
  push:
    branches: [main, desk]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./... > test.log 2>&1 || { cat test.log; exit 1; }
      - name: Publish test log
        if: failure()
        run: |
          git config user.email ci@winforge.local
          git config user.name ci-bot
          git checkout --orphan ci-log
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add test.log
          git commit -m "test log for $GITHUB_SHA"
          git push -f origin ci-log
      - run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Cross compile
        run: make release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make release
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
