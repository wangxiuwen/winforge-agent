name: CI

on:
  push:
    branches: [main, desk]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          go test -race ./... > test.log 2>&1 || {
            echo "::error::TEST-FAILED exit=$? lines=$(grep -c '' test.log)"
            sed -n '1,25p' test.log | sed 's/^/::error::HEAD /'
            grep -E 'FAIL|panic|DATA RACE|fatal error|timed out|shutdown signal|exit status|cannot|undefined|build failed' test.log | sed 's/^/::error::KEY /' | head -30
            tail -60 test.log | sed 's/^/::error::TAIL /'
            exit 1
          }
      - name: Publish test log
        if: failure()
        continue-on-error: true
        run: |
          B64=$(base64 -w0 test.log)
          SHA=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/ci-log/test.log?ref=ci-log" | grep -o '"sha":"[0-9a-f]*"' | head -1 | grep -o '[0-9a-f]\{40\}')
          PAYLOAD="{\"message\":\"test log $GITHUB_SHA\",\"content\":\"$B64\",\"branch\":\"ci-log\""
          if [ -n "$SHA" ]; then PAYLOAD="{\"message\":\"update\",\"content\":\"$B64\",\"branch\":\"ci-log\",\"sha\":\"$SHA\"}"; fi
          HTTP=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/ci-log/test.log" -d "$PAYLOAD")
          echo "::error::PUBLISH-HTTP $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then head -c 400 /tmp/put.json | sed 's/^/::error::PUBLISH-BODY /'; fi
      - run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Cross compile
        run: make release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make release
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
